name: Sales preparation checks
on:
  pull_request:
  push:
    branches: ['sale-prep/**']
permissions:
  contents: read
jobs:
  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  android-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - run: gradle -p android :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --no-daemon
      - run: python3 scripts/check-native-pages.py android/app/build/outputs/apk/debug/app-debug.apk
      - run: '$ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk'
