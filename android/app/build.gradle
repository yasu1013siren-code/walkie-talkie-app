plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.es.staffintercom'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.es.staffintercom'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.1.10'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
