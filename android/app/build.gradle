plugins {
    id 'com.android.application'
}

// The native client only connects to a configured HTTPS origin.
def intercomServerUrl = System.getenv('INTERCOM_SERVER_URL') ?: 'https://walkie-talkie-app-42l7.onrender.com'
if (!(intercomServerUrl ==~ /https:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?/)) throw new GradleException('INTERCOM_SERVER_URL must be an HTTPS origin')

android {
    namespace 'jp.es.staffintercom'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.es.staffintercom.preview'
        buildConfigField 'String', 'SERVER_URL', '"' + intercomServerUrl + '"'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.2.10'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildFeatures { buildConfig = true }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Pinned native audio and Socket.IO protocol-compatible client.
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation ('io.socket:socket.io-client:2.1.2') {
        exclude group: 'org.json', module: 'json'
    }
}
