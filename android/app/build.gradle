plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.es.staffintercom'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.es.staffintercom.preview'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '0.2.4'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildFeatures { buildConfig = true }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Pinned native audio and Socket.IO protocol-compatible client.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation ('io.socket:socket.io-client:2.1.2') {
        exclude group: 'org.json', module: 'json'
    }
}
