<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>インカム</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>

<div id="joinScreen" class="screen">
  <div class="card">
    <h1>📻 インカム</h1>
    <p class="sub">同じルームIDを入力した相手と通話できます</p>
    <input type="text" id="roomInput" placeholder="ルームID (例: family01)" autocomplete="off">
    <input type="text" id="nameInput" placeholder="表示名 (任意)" autocomplete="off">
    <button id="joinBtn">参加する</button>
  </div>
</div>

<div id="talkScreen" class="screen hidden">
  <div class="header">
    <div id="status">接続中...</div>
  </div>

  <div id="participants" class="participants"></div>

  <div class="audio-controls">
    <label for="audioOutput">音声の出力先</label>
    <select id="audioOutput" aria-label="音声の出力先"><option value="">端末の設定に従う</option></select>
    <button id="enableAudio" type="button">音声を再生する</button>
    <p id="audioHelp" class="audio-help" role="status">Bluetoothイヤホンは先にスマホへ接続してください。</p>
    <p id="headsetStatus" class="audio-help" role="status">イヤホンボタンの対応を確認中</p>
  </div>

  <div class="ptt-wrap">
    <button id="pttBtn" class="ptt-btn">押しながら話す</button>
    <p class="hint">ボタンを押している間だけ、あなたの声が送信されます</p>
  </div>

  <button id="leaveBtn" class="leave-btn">退出する</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
